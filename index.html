<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TouchXI</title>
<meta name="description" content="TouchXI: your team, your tactics, your game.">
<meta name="theme-color" content="#1B2A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TouchXI">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
</style>
</head>
<body>
<style>
/* Layout: phone-first single column, sticky team bar on top, tab bar on the bottom, full-screen matchday overlay */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --fg:#141B2B; --muted:#5D6880; --line:#D6DCE6;
  --grass:#2F8F4E; --grass-2:#2A8247; --chalk:rgba(255,255,255,.75);
  --good:#1E8E4F; --warn:#C27A00; --bad:#C9353C; --info:#2F6FD6;
  --team:#1B2A4E; --team-2:#FF2E93; --team-ink:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#171E2B; --surface-2:#212A3A; --fg:#E8ECF3; --muted:#98A3B8; --line:#2C3648;
  --grass:#24703D; --grass-2:#206536; --chalk:rgba(255,255,255,.6);
  --good:#3CC27A; --warn:#E9A83A; --bad:#F06A6F; --info:#6EA0F5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#171E2B; --surface-2:#212A3A; --fg:#E8ECF3; --muted:#98A3B8; --line:#2C3648;
  --grass:#24703D; --grass-2:#206536; --chalk:rgba(255,255,255,.6);
  --good:#3CC27A; --warn:#E9A83A; --bad:#F06A6F; --info:#6EA0F5; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--team)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--team-2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:24px} h3{font-size:19px}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--team);color:var(--team-ink);border-bottom:4px solid var(--team-2)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.badge{width:40px;height:40px;border-radius:50%;background:var(--team-2);color:var(--team);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;flex:none;overflow:hidden;border:2px solid var(--team-ink)}
.badge img{width:100%;height:100%;object-fit:cover}
.bar .tname{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.bar .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:3px}
.bar .grow{flex:1;min-width:0}
.applogo{width:40px;height:40px;border-radius:10px;flex:none;display:block}
.brandfoot{display:flex;align-items:center;gap:12px;justify-content:center;padding-top:6px;color:var(--muted)}
.brandfoot img{width:44px;height:44px;border-radius:11px}
.brandfoot b{display:block;font-family:var(--f-display);font-size:20px;color:var(--fg);letter-spacing:.02em}
.brandfoot span{font-size:11px;letter-spacing:.12em;text-transform:uppercase}

main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:transparent;border:0;padding:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--team);color:var(--team-ink);border-color:var(--team)}
.btn.accent{background:var(--team-2);color:#fff;border-color:var(--team-2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.W{background:var(--good);color:#fff}.pill.D{background:var(--muted);color:var(--surface)}.pill.L{background:var(--bad);color:#fff}
.pill.ex{background:transparent;border:1px dashed var(--muted)}
.pill.over{background:var(--warn);color:#fff}.pill.under{background:var(--info);color:#fff}
.pos{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--fg)}
.pos.p1{background:var(--team);color:var(--team-ink)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.shirt{width:34px;height:34px;flex:none;border-radius:8px;background:var(--team);color:var(--team-ink);font-family:var(--f-display);font-weight:800;font-size:18px;display:grid;place-items:center}
.li .main{flex:1;min-width:0}
.li .title{font-weight:600}
.notice{border:1px dashed var(--muted);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;color:var(--fg);font-weight:500}
textarea.input{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
.tabs button.on{color:var(--fg)}
.tabs button.on svg{color:var(--team-2)}
.tabs svg{width:22px;height:22px}

/* pitch */
.pitch{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/80;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass) 0 10%,var(--grass-2) 10% 20%);border:2px solid var(--chalk)}
.pitch .ln{position:absolute;border:2px solid var(--chalk);pointer-events:none}
.pitch .half{left:-2px;right:-2px;top:-2px;height:4%;border-top:0}
.pitch .box{left:22%;right:22%;bottom:-2px;height:17%;border-bottom:0}
.pitch .six{left:36%;right:36%;bottom:-2px;height:6%;border-bottom:0}
.pitch .arc{left:38%;right:38%;top:-9%;aspect-ratio:1;border-radius:50%}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;border:0;background:none;padding:0;color:#fff}
.tok .dot{width:40px;height:40px;border-radius:50%;background:var(--team);border:2px solid var(--team-2);color:var(--team-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tok.gk .dot{background:var(--team-2);border-color:var(--team);color:#fff}
.tok .nm{font-size:11.5px;font-weight:700;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:5px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .sub{font-size:10px;font-weight:700;opacity:.9;background:rgba(0,0,0,.35);padding:0 5px;border-radius:4px}
.tok.empty .dot{background:rgba(255,255,255,.15);border-style:dashed;border-color:#fff;color:#fff}
.tok.sel .dot{outline:3px solid #FFE14D;outline-offset:2px}
.tok.chg .dot{box-shadow:0 0 0 3px #FFE14D}
.tok.ovr .sub{background:var(--warn)}.tok.und .sub{background:var(--info)}
.bench{display:flex;gap:8px;flex-wrap:wrap}
.bchip{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:44px}
.bchip .shirt{width:28px;height:28px;font-size:15px}
.bchip.sel{outline:3px solid var(--team-2)}
.bchip .m{font-size:11px;color:var(--muted)}
.btabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.btabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;min-height:36px}
.btabs button.on{background:var(--team);color:var(--team-ink);border-color:var(--team)}
.btabs button .lk{font-size:10px;margin-left:4px;opacity:.8}

/* minutes bars */
.mtab{width:100%;border-collapse:collapse;font-size:13px}
.mtab td,.mtab th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.mtab th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.barw{position:relative;height:10px;background:var(--surface-2);border-radius:5px;min-width:60px}
.barw i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--team-2)}
.barw b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.dots{display:flex;gap:3px}
.dots span{width:10px;height:10px;border-radius:3px;background:var(--surface-2)}
.dots span.on{background:var(--team)}
.dots span.gk{background:var(--team-2)}
.scroll-x{overflow-x:auto}

/* matchday */
.md{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.score{background:var(--team);color:var(--team-ink);border-bottom:4px solid var(--team-2)}
.score .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:8px}
.sline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sline .t{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;line-height:1.05;overflow:hidden;text-overflow:ellipsis}
.sline .t.r{text-align:right}
.sline .g{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.clock .per{font-size:18px;background:var(--team-2);color:#fff;padding:2px 8px;border-radius:6px}
.clock .tm{font-size:40px;line-height:1}
.clock .tm.late{color:#FFD24D}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctl .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--team-ink);min-height:52px;font-size:16px}
.ctl .btn.go{background:var(--team-2);border-color:var(--team-2);color:#fff}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick .btn{min-height:58px;flex-direction:column;gap:2px;font-size:13px;padding:6px}
.quick .btn strong{font-family:var(--f-display);font-size:20px;line-height:1}
.alertpop{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--team-2);color:#fff;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.3);animation:pop .25s ease-out}
.alertpop .at{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase}
.alertpop .btn{flex:1;background:#fff;color:#111;border:0;min-height:52px;font-size:16px}
@keyframes pop{from{transform:translateY(100%)}to{transform:none}}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600}
.tgl input[type=checkbox]{width:24px;height:24px;accent-color:var(--team-2)}
.selbar{border:2px solid var(--team-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;background:var(--surface)}
.alert{border-radius:10px;padding:10px 12px;font-weight:600;background:var(--warn);color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.subrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.subrow:last-child{border-bottom:0}
.on-a{color:var(--good);font-weight:700}.off-a{color:var(--bad);font-weight:700}
.ev{display:flex;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{width:52px;color:var(--muted);flex:none}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,10,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pick .btn{justify-content:flex-start;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;font-size:14px;max-width:90vw}
.stat-n{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kpis>div{background:var(--surface-2);border-radius:10px;padding:10px 4px}
.form{display:flex;gap:4px}
.fx{display:flex;gap:12px;align-items:center}
.fx .date{width:48px;text-align:center;flex:none;font-family:var(--f-display);line-height:1}
.fx .date b{display:block;font-size:24px}
.fx .date span{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700}
.swatch{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);padding:0;overflow:hidden}
.swatch input{width:64px;height:64px;margin:-10px;border:0;padding:0;background:none}
.fav{border:0;background:none;font-size:18px;color:var(--muted);padding:4px;min-width:32px}
.fav.on{color:var(--team-2)}
.fcard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 6px 6px 10px;white-space:nowrap;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;font-weight:700;font-family:var(--f-display);font-size:19px}
.fcard.on{border-color:var(--team);box-shadow:inset 0 0 0 2px var(--team)}
@media (max-width:380px){.quick{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

/* ======================= Rotation planner ======================= */
// How well a player suits a slot code.
function fit(p, code){
  const i = p.pos.indexOf(code);
  if(i===0) return 10; if(i===1) return 7; if(i===2) return 4;
  if(code==='GK') return -25;
  if(p.pos[0]==='GK' && p.pos.length===1) return -6;
  const lines = p.pos.map(c=>LINE[c]);
  if(lines[0]===LINE[code]) return 3;
  if(lines.includes(LINE[code])) return 2;
  return 0;
}
// Hungarian algorithm, square min-cost matrix. Returns row -> column.
function hungarian(cost){
  const n=cost.length, INF=1e12, u=new Array(n+1).fill(0), v=new Array(n+1).fill(0), p=new Array(n+1).fill(0), way=new Array(n+1).fill(0);
  for(let i=1;i<=n;i++){
    p[0]=i; let j0=0; const minv=new Array(n+1).fill(INF), used=new Array(n+1).fill(false);
    do{ used[j0]=true; const i0=p[j0]; let delta=INF, j1=0;
      for(let j=1;j<=n;j++) if(!used[j]){ const cur=cost[i0-1][j-1]-u[i0]-v[j]; if(cur<minv[j]){minv[j]=cur;way[j]=j0;} if(minv[j]<delta){delta=minv[j];j1=j;} }
      for(let j=0;j<=n;j++){ if(used[j]){u[p[j]]+=delta;v[j]-=delta;} else minv[j]-=delta; }
      j0=j1; } while(p[j0]!==0);
    do{ const j1=way[j0]; p[j0]=p[j1]; j0=j1; } while(j0);
  }
  const ans=new Array(n); for(let j=1;j<=n;j++) if(p[j]) ans[p[j]-1]=j-1; return ans;
}
// Place chosen players into formation slots. prev: array slot->pid for continuity. gk: pid forced into GK.
function assign(pids, slots, prev, gk){
  const n=Math.max(pids.length, slots.length);
  const cost=[];
  for(let i=0;i<n;i++){ const row=[]; const pl=i<pids.length?player(pids[i]):null;
    for(let j=0;j<n;j++){
      if(!pl || j>=slots.length){ row.push(j===0&&!pl?60:0); continue; } // keep GK slot filled when short
      let s=fit(pl,slots[j].code);
      if(prev && prev[j]===pl.id) s+=3;
      if(gk){ if(pl.id===gk && j===0) s+=100; else if(pl.id===gk || j===0) s-=100; }
      row.push(-s);
    } cost.push(row); }
  const a=hungarian(cost); const out=new Array(slots.length).fill(null); let total=0;
  for(let i=0;i<pids.length;i++){ const j=a[i]; if(j<slots.length){ out[j]=pids[i]; total+=-cost[i][j]; } }
  return {slots:out,score:total};
}
// Fair-share targets in minutes. Returns {targets, keeper}.
function targetsFor(fx, pids){
  const F=formationById(fx.formationId), K=F.slots.length, full=fx.periods*fx.periodMins;
  const prefs=fx.prefs||{}; const w=id=>({more:1.3,limited:0.55}[prefs[id]]||1);
  const gks=pids.filter(id=>player(id).pos[0]==='GK');
  const keeper = gks.length===1 ? gks[0] : null;
  const t={}; let pool=pids.filter(id=>id!==keeper), mins=K*full;
  if(keeper){ t[keeper]=full; mins-=full; }
  if(pids.length<=K){ pids.forEach(id=>t[id]=full); return {targets:t,keeper}; }
  // water-fill with cap at full time
  let free=[...pool], remain=mins;
  for(let it=0;it<10&&free.length;it++){
    const W=free.reduce((s,id)=>s+w(id),0); let capped=false;
    for(const id of free){ t[id]=remain*w(id)/W; }
    for(const id of [...free]) if(t[id]>full){ t[id]=full; capped=true; }
    if(!capped) break;
    const fixed=free.filter(id=>t[id]>=full); free=free.filter(id=>t[id]<full); remain=mins-pool.filter(id=>!free.includes(id)).reduce((s,id)=>s+t[id],0);
  }

}
// Build lineups for blocks [from..end). played: pid->minutes already played before `from`. prev: lineup before `from`.
function planFrom(fx, from, played, prev, respectLocks){

    const old = fx.plan&&fx.plan.blocks&&fx.plan.blocks[b];
    if(respectLocks && old && old.locked && old.slots.length===K){
      const sl=old.slots.map(id=>pids.includes(id)?id:null);
      blocks.push({slots:sl,locked:true}); sl.forEach(id=>{if(id)played[id]+=bm}); prev=sl; continue;
    }
    let chosen, gk=null;
    if(pids.length<=K){ chosen=[...pids]; gk=keeper||pickGk(pids,played,targets,prev); }
    else{
      gk = keeper || pickGk(pids,played,targets,prev);

            const trial=chosen.map(x=>x===s?q:x); const sc=assign(trial,slots,prev,gk).score;
            if(sc>cur+4 && (!best||sc>best.sc)) best={s,q,sc}; } }
        if(!best) break;

}
function pickGk(pids,played,targets,prev){
  const c=pids.filter(id=>player(id).pos.includes('GK'));
  if(prev&&prev[0]&&c.includes(prev[0])&&c.length===1) return prev[0];
  if(c.length){ return c.sort((a,b)=>{const ra=player(a).pos.indexOf('GK'), rb=player(b).pos.indexOf('GK'); if(ra!==rb) return ra-rb; return (targets[b]-played[b])-(targets[a]-played[a]);})[0]; }

function autoPlan(fx, keepLocks){
  if(!formationById(fx.formationId) || formationById(fx.formationId).format!==fx.format){
    const t=team(); fx.formationId=(t.favs||[]).find(id=>formationById(id)&&formationById(id).format===fx.format) || formationsFor(fx.format).find(f=>f.style==='Balanced').id;

function planMinutes(fx){
  const bm=blockMins(fx), m={};

// Replan the blocks after b, keeping 0..b. Used when a coach edits a block before the match.
function replanAfter(fx,b){

/* ======================== Live match engine ======================== */
function newMatch(fx){
  if(!fx.plan||fx.plan.formationId!==fx.formationId||fx.plan.blocks.length!==blockCount(fx)) autoPlan(fx,true);

    stints:lineup.filter(Boolean).map((pid,i)=>({pid,code:formationById(fx.formationId).slots[lineup.indexOf(pid)].code,from:0,to:null})),
    events:[], us:0, them:0, ended:false, plan:fx.plan.blocks.map(b=>({slots:[...b.slots]})), startedAt:null};

function periodElapsed(m){ return (m.acc + (m.running? (Date.now()-m.runStart):0))/1000; }

  }});

/* ============================ Stats ============================ */
function computeStats(filter){
  const fxs=fixtures().filter(f=>f.status==='played'&&f.score).filter(f=>(!filter.season||season(f.date)===filter.season)&&(!filter.comp||f.competition===filter.comp));
  const ps={}; squad().forEach(p=>ps[p.id]={p,apps:0,starts:0,subs:0,min:0,goals:0,assists:0,motm:0,star:0,pos:{}});
  const pitch={};
  const T={P:0,W:0,D:0,L:0,GF:0,GA:0};
  fxs.forEach(f=>{ T.P++; T[result(f)]++; T.GF+=f.score.us; T.GA+=f.score.them;
    if(f.motm&&ps[f.motm]) ps[f.motm].motm++; if(f.star&&ps[f.star]) ps[f.star].star++;
    const pk=f.pitch||'Not recorded', pt=pitch[pk]=pitch[pk]||{P:0,W:0,D:0,L:0,GF:0,GA:0}; pt.P++; pt[result(f)]++; pt.GF+=f.score.us; pt.GA+=f.score.them;
    (f.scorers||[]).forEach(s=>{ if(ps[s.pid]) ps[s.pid].goals++; if(s.assist&&ps[s.assist]) ps[s.assist].assists++; });
    if(f.match){ const seen={};
      f.match.stints.forEach(s=>{ const r=ps[s.pid]; if(!r) return; r.min+=(s.to-s.from)/60; r.pos[s.code]=(r.pos[s.code]||0)+(s.to-s.from); if(!seen[s.pid]){seen[s.pid]=s.from<1?'start':'sub';} });
      Object.entries(seen).forEach(([id,k])=>{ ps[id].apps++; if(k==='start') ps[id].starts++; else ps[id].subs++; });
    }
  });
  const opp={}; fxs.forEach(f=>{ const o=opp[f.opponent]=opp[f.opponent]||{P:0,W:0,D:0,L:0,GF:0,GA:0}; o.P++; o[result(f)]++; o.GF+=f.score.us; o.GA+=f.score.them; });
  return {T,players:Object.values(ps),opp,fxs,pitch};
}

/* ---------- Fixture / team picker ---------- */
function pitchHtml(F, slots, opts={}){
  const {sel=null, minutes=null, flags={}, changed=[]}=opts;
  return `<div class="pitch"><div class="ln half"></div><div class="ln arc"></div><div class="ln box"></div><div class="ln six"></div>
   ${F.slots.map((s,j)=>{ const p=slots[j]?player(slots[j]):null;
     const cls=['tok',j===0?'gk':'',p?'':'empty',sel===j?'sel':'',changed.includes(j)?'chg':'',p&&flags[p.id]?flags[p.id]:''].join(' ');
     return `<button class="${cls}" style="left:${s.x}%;top:${s.y}%" data-a="slot" data-j="${j}"><span class="dot">${p?(p.number??''):'+'}</span><span class="nm">${p?esc(firstName(p)):s.code}</span><span class="sub" ${p&&minutes?`data-min="${p.id}"`:''}>${p&&minutes?minutes(p.id):s.code}</span></button>`;}).join('')}
  </div>`;
}

  const F=formationById(fx.formationId);
  const B=blockCount(fx); ui.block=Math.min(ui.block,B-1);

  const full=fx.periods*fx.periodMins;
  const style=ui.styleTab||F.style;
  const prefLabel={'':'Normal',more:'More time',limited:'Limited',start:'Must start',injured:'Injured'};
  return `<div class="stack">
   <div class="row between"><button class="btn ghost sm" data-a="nav" data-v="fixtures">‹ Fixtures</button><button class="btn sm" data-a="editFx" data-id="${fx.id}">Edit details</button></div>
   <div><div class="eyebrow">${fmtDate(fx.date)}${fx.time?' · '+esc(fx.time):''} · ${fx.homeAway==='H'?'Home':fx.homeAway==='A'?'Away':'Neutral'}</div><h2 style="font-size:30px;margin-top:4px">v ${esc(fx.opponent)}</h2>
   <div class="muted small" style="margin-top:4px">${esc(fx.competition||'')} · ${fx.format}v${fx.format} · ${fx.periods}×${fx.periodMins} min${fx.windows>1?` · subs every ${blockMins(fx)} min`:''}</div></div>

   <div class="card stack"><div class="row between"><div class="eyebrow">Available · <span class="num">${fx.available.length}</span> of ${ps.length}</div><div class="row" style="gap:6px"><button class="btn sm" data-a="availAll">All</button><button class="btn sm" data-a="availNone">None</button></div></div>

       return `<div class="li" style="gap:10px"><button class="shirt" style="border:0;${on?'':'background:var(--surface-2);color:var(--muted)'}" data-a="toggleAvail" data-id="${p.id}" aria-pressed="${on}" aria-label="Toggle ${esc(p.name)} available">${p.number??''}</button>
         <button class="main" style="border:0;background:none;text-align:left;padding:0;${on?'':'color:var(--muted);text-decoration:line-through'}" data-a="toggleAvail" data-id="${p.id}"><span class="title">${esc(p.name)}</span> ${on&&inj?'<span class="pill" style="background:var(--bad);color:#fff">Injured</span>':''} <span class="small muted">${p.pos.join(' · ')}</span></button>
         ${on?`<select class="input" style="width:auto;min-height:36px;padding:4px 8px;font-size:13px" data-a="pref" data-id="${p.id}">${Object.entries(prefLabel).map(([k,l])=>`<option value="${k}" ${pr===k?'selected':''}>${l}</option>`).join('')}</select>`:'<span class="small muted">Unavailable</span>'}</div>`;}).join('')}</div>
     ${fx.available.length<fx.format?`<div class="alert">Only ${fx.available.length} available for ${fx.format}v${fx.format}. Some positions will be empty.</div>`:''}
   </div>

   <div class="card stack"><div class="eyebrow">Formation · ${fx.format}v${fx.format}</div>
     <div class="seg">${STYLES.map(s=>`<button class="${style===s?'on':''}" data-a="styleTab" data-s="${s}">${s}</button>`).join('')}</div>
     <div class="grid3">${formationsFor(fx.format).filter(f=>f.style===style).map(f=>`<div class="fcard ${f.id===fx.formationId?'on':''}"><button style="border:0;background:none;font:inherit;padding:0;flex:1;text-align:left;min-height:32px" data-a="setFormation" data-id="${f.id}">${f.name}</button><button class="fav ${(t.favs||[]).includes(f.id)?'on':''}" data-a="fav" data-id="${f.id}" aria-label="Favourite ${f.name}">★</button></div>`).join('')}</div>
     ${(t.favs||[]).filter(id=>formationById(id)?.format===fx.format).length?`<div class="small muted">Favourites: ${(t.favs||[]).filter(id=>formationById(id)?.format===fx.format).map(id=>`<button class="btn sm" data-a="setFormation" data-id="${id}">${formationById(id).name}</button>`).join(' ')}</div>`:''}
   </div>

   <div class="card stack">
     <div class="row between"><div class="eyebrow">Rotation plan</div><button class="btn sm" data-a="autoPlan">Re-plan all</button></div>
     <div class="btabs">${fx.plan.blocks.map((b,i)=>`<button class="${i===ui.block?'on':''}" data-a="block" data-b="${i}">${blockLabel(fx,i)}${b.locked?'<span class="lk">edited</span>':''}</button>`).join('')}</div>

     <div class="small muted">Tap two players to swap them. Edited periods stay as you set them and later periods re-plan around them.</div>
   </div>

   <div class="card stack"><div class="eyebrow">Planned minutes</div>
     <div class="scroll-x"><table class="mtab num"><thead><tr><th>Player</th><th style="width:40%">Minutes <span style="text-transform:none;letter-spacing:0;font-weight:500">(line = fair share)</span></th><th>Plan</th></tr></thead><tbody>
     ${fitIds(fx).sort((a,b)=>pm[b]-pm[a]).map(id=>{const p=player(id); const pct=Math.min(100,pm[id]/full*100), tg=Math.min(100,(targets[id]||0)/full*100);
       return `<tr><td>${esc(firstName(p))}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="barw" style="flex:1"><i style="width:${pct}%"></i><b style="left:${tg}%"></b></div><span style="width:30px;text-align:right">${Math.round(pm[id])}</span></div></td>
       <td><div class="dots">${fx.plan.blocks.map(b=>{const j=b.slots.indexOf(id);return `<span class="${j===0?'gk':j>0?'on':''}" title="${j>=0?F.slots[j].code:'bench'}"></span>`}).join('')}</div></td></tr>`;}).join('')}
     </tbody></table></div>
   </div>
   <button class="btn primary big" data-a="openMatch" data-id="${fx.id}">${fx.match?'Resume matchday':'Go to matchday'}</button>
   <button class="btn" data-a="manualResult" data-id="${fx.id}">Enter result and match report</button>

    <div class="row between"><button class="btn ghost sm" data-a="nav" data-v="fixtures">‹ Fixtures</button><div class="row" style="gap:6px"><button class="btn sm" data-a="manualResult" data-id="${fx.id}">Match report</button><button class="btn sm" data-a="editFx" data-id="${fx.id}">Details</button></div></div>
    <div class="card" style="text-align:center"><div class="eyebrow">${fmtDate(fx.date)} · ${esc(fx.competition||'')}</div>
     <div class="sline" style="margin-top:10px"><div class="t r">${esc(team().name)}</div><div class="stat-n num" style="font-size:44px">${fx.score.us}–${fx.score.them}</div><div class="t" style="text-align:left">${esc(fx.opponent)}</div></div>

     ${fx.score.us>goals.length?`<p class="small muted" style="margin:10px 0 0">${fx.score.us-goals.length} of our ${fx.score.us} goals have no scorer recorded.</p>`:''}</div>

     <p class="small muted" style="margin:0">Use <b>Match report</b> to fix the score, scorers, assists, pitch or awards, and <b>Details</b> for the date, opponent and format.</p>

/* ---------- Stats ---------- */
function vStats(){
  const all=fixtures().filter(f=>f.status==='played'&&f.score);
  const seasons=[...new Set(all.map(f=>season(f.date)))].sort().reverse();
  const comps=[...new Set(all.map(f=>f.competition).filter(Boolean))];
  const st=computeStats(ui.filter||{});
  const T=st.T, gd=T.GF-T.GA;
  const rows=st.players.sort((a,b)=>b.min-a.min||b.goals-a.goals);
  const opp=Object.entries(st.opp).sort((a,b)=>b[1].P-a[1].P);
  const recent=[...st.fxs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).reverse();

function trendSvg(fxs){

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Goal difference in recent matches" style="max-width:100%">

   ${fxs.map((f,i)=>{const d=f.score.us-f.score.them, h=Math.abs(d)/max*(mid-10), x=pad+i*bw+bw*0.2; const y=d>=0?mid-h:mid;
     return `<rect x="${x}" y="${y}" width="${bw*0.6}" height="${Math.max(h,2)}" rx="2" fill="${d>0?'var(--good)':d<0?'var(--bad)':'var(--muted)'}"><title>${esc(f.opponent)} ${f.score.us}-${f.score.them}</title></rect>`}).join('')}

}

function diffLineup(cur,next){
  const ons=next.filter(id=>id&&!cur.includes(id)), offs=cur.filter(id=>id&&!next.includes(id));
  const F=null; const pairs=ons.map((on,i)=>{ const j=next.indexOf(on); const fx=fixture(ui.fxId); const code=formationById(fx.match.formationId).slots[j].code; return [on, cur[j]&&offs.includes(cur[j])?cur[j]:offs[i], code]; });
  const moves=next.filter((id,j)=>id&&cur.includes(id)&&cur[j]!==id).length;
  return {ons,offs,pairs,moves};
}
let tick=null, wake=null, audio=null;
const ALERT_DEFAULT={periodEnd:true,warn:2,custom:[],subWindow:true,sound:true,vibrate:true};
const alertCfg=()=>{ const a=Object.assign({},ALERT_DEFAULT,team().alerts||{}); a.custom=a.custom||[]; return a; };
const setAlertCfg=c=>{ team().alerts=c; };
function unlockAudio(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended') audio.resume(); }catch(e){} }
function beep(){ try{ unlockAudio(); if(!audio) return; const t0=audio.currentTime;
  [0,0.32,0.64].forEach((d,i)=>{ const o=audio.createOscillator(), g=audio.createGain(); o.type='square'; o.frequency.value=i===2?1175:880;
    g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.26);
    o.connect(g); g.connect(audio.destination); o.start(t0+d); o.stop(t0+d+0.28); }); }catch(e){} }
function ring(c){ if(c.sound) beep(); if(c.vibrate&&navigator.vibrate){ try{ navigator.vibrate([400,150,400,150,400]); }catch(e){} } }
function checkAlerts(fx,m){
  if(m.ended) return;
  const c=alertCfg(), per=periodElapsed(m), L=fx.periodMins*60, P=m.period, last=P>=fx.periods-1, lbl=periodLabel(fx,P);
  m.fired=m.fired||[];
  const fire=(key,title,body,subs)=>{ if(m.fired.includes(key)) return; m.fired.push(key); m.alert={title,body,subs}; ring(c); save(); renderMatch(); };
  if(c.warn>0 && per>=L-c.warn*60 && per<L) fire(P+':warn',`${c.warn} min left in ${lbl}`, last?'Get ready for full time.':'Get your next changes ready.', !last);
  if(c.periodEnd && per>=L) fire(P+':end',`${lbl}: time is up`, last?'Full time when you are ready.':'Time to make your changes.', !last);
  c.custom.forEach(a=>{ const t=(+a.min||0)*60; if(t>0 && t<L && per>=t && per<t+30) fire(`${P}:c${a.min}`,`${a.min} min into ${lbl}`, a.note||'Reminder', true); });
  if(c.subWindow && fx.windows>1){ const w=Math.floor(per/(blockMins(fx)*60)); if(w>0&&w<fx.windows) fire(`${P}:w${w}`,'Sub window','Time to make the planned subs.', true); }
}
function startTick(){

/* ---------- CSV import ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','||c==='\t'){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function parseDate(s){
  s=s.trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ let y=m[3]; if(y.length===2) y='20'+y; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const d=new Date(s); if(!isNaN(d)) return d.toISOString().slice(0,10);
  return null;
}
function previewCSV(text){
  const rows=parseCSV(text); const out={rows:[],errors:[]};
  if(rows.length<2){ out.errors.push('Need a heading row and at least one result'); return out; }
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>h.findIndex(x=>names.some(n=>x===n||x.includes(n)));
  const cD=col('date'), cO=col('opponent','opposition','vs','team'), cS=col('score','result'), cF=col('for','scored','us','gf'), cA=col('against','conceded','them','ga'), cC=col('competition','comp','type'), cV=col('venue','ground'), cH=col('home/away','h/a','home');
  if(cD<0||cO<0){ out.errors.push('Could not find Date and Opponent columns'); return out; }
  rows.slice(1).forEach((r,i)=>{
    const date=parseDate(r[cD]||''); const opp=(r[cO]||'').trim();
    let us=null, them=null;
    if(cF>=0&&cA>=0&&r[cF]!==undefined&&r[cF].trim()!==''){ us=parseInt(r[cF]); them=parseInt(r[cA]); }
    else if(cS>=0){ const m=(r[cS]||'').match(/(\d+)\s*[-–:]\s*(\d+)/); if(m){us=+m[1];them=+m[2];} }
    if(!date||!opp||isNaN(us)||isNaN(them)||us===null){ out.errors.push(`row ${i+2}`); return; }
    const ha=cH>=0?(r[cH]||'').trim().toUpperCase()[0]:'H';
    out.rows.push({date,opponent:opp,us,them,competition:cC>=0?(r[cC]||'').trim():'',venue:cV>=0?(r[cV]||'').trim():'',homeAway:ha==='A'?'A':ha==='N'?'N':'H'});
  });
  return out;
}

    f.scorers=x.scorers.filter(g=>g.pid).map(g=>({pid:g.pid==='og'?null:g.pid,assist:g.assist||null}));
    f.pitch=x.pitch||''; f.motm=x.motm||null; f.star=x.star||null; f.status='played';
    if(f.match&&!f.match.ended) f.match=null; ui.sheet=null; toast('Match report saved'); },
  importSheet(){ ui.sheet={k:'import'}; },
  previewImport(){ ui.sheet.text=val('csvTxt'); ui.sheet.preview=previewCSV(ui.sheet.text); },
  doImport(){ const t=team(); let n=0, dup=0;
    ui.sheet.preview.rows.forEach(r=>{ if(fixtures().some(f=>f.date===r.date&&f.opponent.toLowerCase()===r.opponent.toLowerCase())){dup++;return;}
      db.fixtures.push({id:uid(),teamId:t.id,date:r.date,time:'',opponent:r.opponent,venue:r.venue,homeAway:r.homeAway,competition:r.competition||'League',format:t.format,periods:t.periods,periodMins:t.periodMins,windows:1,available:[],prefs:{},formationId:null,plan:null,match:null,score:{us:r.us,them:r.them},scorers:[],status:'played',imported:true}); n++; });
    ui.sheet=null; toast(`Imported ${n} result${n===1?'':'s'}${dup?`, skipped ${dup} already here`:''}`); },
  clearSample(){ const t=team(); const ids=new Set(db.players.filter(p=>p.teamId===t.id&&p.sample).map(p=>p.id));
    db.players=db.players.filter(p=>!ids.has(p.id)); db.fixtures=db.fixtures.filter(f=>!(f.teamId===t.id&&f.sample));
    db.fixtures.forEach(f=>{ f.available=f.available.filter(id=>!ids.has(id)); if(f.status!=='played') f.plan=null; }); toast('Examples cleared'); },
  clearBadge(){ team().badge=null; },
  preset(d){ const [p,s,t]=d.c.split(','); Object.assign(team().colors,{primary:p,secondary:s,text:t}); },
  switchTeam(d){ db.activeTeamId=d.id; ui.view='home'; },
  addTeam(){ ui.sheet={k:'team'}; },
  createTeam(){ const n=val('ntName').trim(); if(!n){ toast('Add a team name'); return 'keep'; } const t={id:uid(),name:n,short:n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(),badge:null,colors:{primary:'#C8102E',secondary:'#FFFFFF',text:'#FFFFFF'},format:7,periods:2,periodMins:25,windows:1,favs:[]}; db.teams.push(t); db.activeTeamId=t.id; ui.sheet=null; ui.view='team'; toast('Team created'); },
  backup(){ const txt=JSON.stringify(db); ui.sheet={k:'backup'}; try{ navigator.clipboard.writeText(txt).then(()=>{ ui.sheet&&(ui.sheet.copied=true); renderSheet(); },()=>{ const t=document.getElementById('backupTxt'); t&&t.select(); }); }catch(e){} },
  restoreSheet(){ ui.sheet={k:'restore'}; },
  restore(){ try{ const d=JSON.parse(val('restoreTxt')); if(!d.teams||!d.players||!d.fixtures) throw 0; db=d; ui.sheet=null; ui.view='home'; toast('Backup restored'); }catch(e){ toast("That doesn't look like a backup from this app"); return 'keep'; } },
};
function markInjured(fx,m,id){ fx.injured=fx.injured||[]; if(!fx.injured.includes(id)) fx.injured.push(id);
  if(m&&!m.ended) m.events.push({id:uid(),type:'inj',sec:matchSec(m),period:m.period,pid:id}); }
// Bench players ranked for a slot: position fit plus how much they still need minutes.
function rankReplacements(fx,m,slotIdx){
  const code=formationById(m.formationId).slots[slotIdx].code, ids=fitIds(fx).filter(x=>!m.lineup.includes(x));
  const {targets}=targetsFor({...fx,formationId:m.formationId},fitIds(fx));
  const sc=x=>fit(player(x),code)+((targets[x]||0)-playedSec(m,x)/60)/blockMins(fx)*3;
  return {code,ids:ids.sort((a,b)=>sc(b)-sc(a))};
}
function sheetAsk(){ const q=ui.sheet;
  return `<h2>${esc(q.title)}</h2><p style="margin:0">${esc(q.body)}</p>
   <div class="grid2"><button class="btn big" data-a="closeSheet">Cancel</button><button class="btn big ${q.danger?'danger':'primary'}" data-a="askYes">${esc(q.yes)}</button></div>`; }
function sheetAlerts(){
  const c=alertCfg(), fx=curFx(), per=fx?periodLabel(fx,0).replace(/^Q1$/,'quarter').replace(/half$/,'half'):'period';
  const unit=fx&&fx.periods===4?'quarter':fx&&fx.periods===2?'half':'period';
  return `<h2>Match alerts</h2>
   <p class="small muted" style="margin:0">Alerts beep, vibrate and pop up while the matchday screen is open. Keep the phone off silent. They apply to every match for ${esc(team().name)}.</p>
   <div>
    <label class="tgl"><span>End of each ${unit}<br><span class="small muted" style="font-weight:400">Fires when the ${unit} time runs out${fx?`, at ${fx.periodMins}:00`:''}</span></span><input type="checkbox" data-a="al" data-k="periodEnd" ${c.periodEnd?'checked':''}></label>
    <label class="tgl"><span>Warning before the end</span><select class="input" style="width:auto" data-a="al" data-k="warn">${[0,1,2,3,5].map(n=>`<option value="${n}" ${+c.warn===n?'selected':''}>${n?n+' min before':'Off'}</option>`).join('')}</select></label>
    ${fx&&fx.windows>1?`<label class="tgl"><span>Rolling sub windows<br><span class="small muted" style="font-weight:400">Every ${blockMins(fx)} min</span></span><input type="checkbox" data-a="al" data-k="subWindow" ${c.subWindow?'checked':''}></label>`:''}
    <label class="tgl"><span>Sound</span><input type="checkbox" data-a="al" data-k="sound" ${c.sound?'checked':''}></label>
    <label class="tgl"><span>Vibrate<br><span class="small muted" style="font-weight:400">Android phones only. iPhones don't let web pages vibrate.</span></span><input type="checkbox" data-a="al" data-k="vibrate" ${c.vibrate?'checked':''}></label>
   </div>
   <div class="stack" style="gap:8px"><div class="row between"><div class="eyebrow">Your own alerts</div><button class="btn sm" data-a="alAdd">+ Add alert</button></div>
    ${c.custom.map((a,i)=>`<div class="row" style="gap:6px;flex-wrap:nowrap"><span class="small muted" style="flex:none">At</span><input class="input num" style="width:70px;flex:none" type="number" inputmode="numeric" min="1" value="${esc(a.min)}" data-a="alc" data-i="${i}" data-k="min" aria-label="Minutes"><span class="small muted" style="flex:none">min</span><input class="input" style="min-width:0;flex:1" value="${esc(a.note||'')}" placeholder="e.g. Check subs" data-a="alc" data-i="${i}" data-k="note" aria-label="Alert message"><button class="btn sm ghost" style="flex:none" data-a="alRm" data-i="${i}" aria-label="Remove alert">✕</button></div>`).join('')||`<span class="small muted">None yet. For example, add one at 7 minutes into each ${unit} to check playing time or have a drinks break.</span>`}
    ${c.custom.length?`<span class="small muted">Minutes count from the start of each ${unit}.</span>`:''}
   </div>
   <div class="grid2"><button class="btn" data-a="alTest">Test alert</button><button class="btn primary" data-a="closeSheet">Done</button></div>`;
}
function sheetInjury(){
  const fx=curFx(), m=fx.match, id=ui.sheet.id, p=player(id), j=m.lineup.indexOf(id);
  const {code,ids}=rankReplacements(fx,m,j), sec=matchSec(m);
  return `<h2>Who replaces ${esc(firstName(p))}?</h2>
   <p class="small muted" style="margin:0">${esc(p.name)} comes off injured and is left out of the rest of the game. Pick who goes on at ${code}. The sub plan then updates.</p>
   <div class="list">${ids.map((x,i)=>{const q=player(x); return `<button class="li" data-a="injReplace" data-rep="${x}"><span class="shirt">${q.number??''}</span><div class="main"><div class="title">${esc(q.name)} ${i===0?'<span class="pill under">Suggested</span>':''}</div><div class="small muted">${q.pos.length?q.pos.join(' · '):'No positions set'} · ${mins_(playedSec(m,x,sec))}' played</div></div><span class="muted">›</span></button>`;}).join('')||'<p class="small muted">Nobody left on the bench.</p>'}</div>
   <button class="btn" data-a="injReplace" data-rep="">Nobody, play a player short</button>
   <button class="btn ghost" data-a="closeSheet">Cancel, ${esc(firstName(p))} stays on</button>`;
}
const val = id => { const e=document.getElementById(id); return e?e.value:''; };

// Pre-match plan edits: tap two players to swap; edited block is locked; later blocks re-plan.
function planTap(t){
  const fx=curFx(); const blk=fx.plan.blocks[ui.block];
  if(!ui.sel){ if(t.t==='slot'&&!blk.slots[t.j]&&!fx.available.length) return; ui.sel=t; return; }
  const a=ui.sel, b=t; ui.sel=null;
  if(a.t==='bench'&&b.t==='bench') { ui.sel=b; return; }
  const sl=[...blk.slots];
  const get=x=>x.t==='slot'?sl[x.j]:x.id;
  if(a.t==='slot'&&b.t==='slot'){ if(a.j===b.j) return; [sl[a.j],sl[b.j]]=[sl[b.j],sl[a.j]]; }
  else { const s=a.t==='slot'?a:b, bn=a.t==='bench'?a:b; sl[s.j]=bn.id; }
  blk.slots=sl; blk.locked=true; replanAfter(fx,ui.block);
}
// Live edits: slot+bench = substitution now; slot+slot = switch positions.
function liveTap(t){
  const fx=curFx(), m=fx.match; if(m.ended) return;
  if(!ui.sel){ ui.sel=t; return; }
  const a=ui.sel, b=t; ui.sel=null;
  if(a.t==='bench'&&b.t==='bench'){ ui.sel=b; return; }
  const sl=[...m.lineup];
  if(a.t==='slot'&&b.t==='slot'){ if(a.j===b.j) return; [sl[a.j],sl[b.j]]=[sl[b.j],sl[a.j]]; setLineup(fx,m,sl); toast('Positions switched'); return; }
  const s=a.t==='slot'?a:b, bn=a.t==='bench'?a:b; const off=sl[s.j]; sl[s.j]=bn.id; setLineup(fx,m,sl);
  toast(`${firstName(player(bn.id))} on${off?' for '+firstName(player(off)):''}`);
}

/* ---------- Event wiring ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(e.target.classList&&e.target.classList.contains('scrim')){ ui.sheet=null; ui.confirm=null; render(); return; }
  if(!el||el.tagName==='SELECT'||el.tagName==='INPUT') return;
  const fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault();
  const r=fn(el.dataset);
  if(r==='keep') return;
  render();
});
document.addEventListener('change',e=>{
  const el=e.target; const a=el.dataset&&el.dataset.a;
  if(el.id==='badgeFile'&&el.files[0]){ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=160; const g=c.getContext('2d'); const s=Math.min(img.width,img.height); g.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,160,160); team().badge=c.toDataURL('image/png'); render(); }; img.src=fr.result; }; fr.readAsDataURL(el.files[0]); return; }
  if(!a) return;
  if(a==='al'||a==='alc'){ const c=alertCfg(); const v=el.type==='checkbox'?el.checked:el.value;
    if(a==='al') c[el.dataset.k]=el.dataset.k==='warn'?+v:v; else c.custom[+el.dataset.i][el.dataset.k]=el.dataset.k==='min'?Math.max(1,parseInt(v)||1):v;
    if(a==='alc') c.custom.sort((x,y)=>x.min-y.min);
    setAlertCfg(c); if(a==='alc'&&el.dataset.k==='min') setTimeout(renderSheet); save(); return; }
  if(a==='mf'||a==='gr'){ draftField(el); if(el.dataset.k==='us'||el.dataset.k==='pid') setTimeout(renderSheet); return; }
  if(a==='pref'){ const f=curFx(), id=el.dataset.id; f.prefs=f.prefs||{}; f.injured=(f.injured||[]).filter(x=>x!==id);
    if(el.value==='injured'){ f.injured.push(id); delete f.prefs[id]; } else if(el.value) f.prefs[id]=el.value; else delete f.prefs[id];
    if(f.match&&!f.match.ended) replanLive(f,f.match); else autoPlan(f,false); }
  else if(a==='filter'){ ui.filter=Object.assign({},ui.filter,{[el.dataset.k]:el.value}); }
  else if(a==='teamField'){ team()[el.dataset.k]=el.value; }
  else if(a==='teamNum'){ team()[el.dataset.k]=+el.value; }
  else if(a==='color'){ team().colors[el.dataset.k]=el.value; }
  render();
});
function draftField(el){ const a=el.dataset.a; if(!ui.sheet||!ui.sheet.draft) return false;
  if(a==='mf'){ ui.sheet.draft[el.dataset.k]=el.value; return true; }
  if(a==='gr'){ ui.sheet.draft.scorers[+el.dataset.i][el.dataset.k]=el.value; return true; } return false; }
document.addEventListener('input',e=>{ if(e.target.dataset&&(e.target.dataset.a==='mf'||e.target.dataset.a==='gr')){ draftField(e.target); return; } if(e.target.dataset&&e.target.dataset.a==='color'){ team().colors[e.target.dataset.k]=e.target.value; applyTheme(); } });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(ui.view==='match'){ keepAwake(); renderMatch(); } } });

load();
if(ui.view==='match') ui.view='fixture';
render();
startTick();
